<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Victor Natã — Desenvolvedor em formação</title>
  <desc id="desc">Banner escuro com detalhes em roxo e azul para o perfil de Victor Natã.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".08">
    <path d="M0 250 250 0M100 320 420 0M850 320 1170 0"/>
    <circle cx="1020" cy="160" r="110"/>
    <circle cx="1020" cy="160" r="150"/>
  </g>
  <rect x="72" y="66" width="6" height="188" rx="3" fill="url(#accent)"/>
  <text x="108" y="145" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Victor Natã</text>
  <text x="110" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="25">Desenvolvedor em formação</text>
  <text x="110" y="238" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="19">Aprendendo, construindo e evoluindo um projeto de cada vez.</text>
  <circle cx="1020" cy="160" r="58" fill="#111827" stroke="url(#accent)" stroke-width="3"/>
  <text x="1020" y="174" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">VN</text>
  <rect x="0" y="312" width="1200" height="8" rx="4" fill="url(#accent)"/>
</svg>